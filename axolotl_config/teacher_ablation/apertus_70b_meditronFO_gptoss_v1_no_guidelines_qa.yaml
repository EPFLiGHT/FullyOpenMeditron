wandb_name: apertus_70b_meditronFO_gptoss_v1_no_guidelines_qa
output_dir: $SCRATCH/meditronfo/models/apertus_70b_meditronFO_gptoss_v1_no_guidelines_qa
dataset_prepared_path: $SCRATCH/meditronfo/prepared/apertus_70b_meditronFO_gptoss_v1_no_guidelines_qa

base_model: $STORAGE_ROOT/apertus/huggingface/swiss-ai/Apertus-70B-Instruct-2509

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

load_in_8bit: false
load_in_4bit: false

datasets:
  - path: $PROJECT_ROOT/data/corpora/meditronfo_gptoss_v1/curated_qa.jsonl
    ds_type: json
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
    roles:
      system: [system]
      user: [user, human]
      assistant: [assistant, gpt]

  - path: $PROJECT_ROOT/data/corpora/meditronfo_gptoss_v1/synthetic_qa.jsonl
    ds_type: json
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
    roles:
      system: [system]
      user: [user, human]
      assistant: [assistant, gpt]

  - path: $PROJECT_ROOT/data/corpora/meditronfo_gptoss_v1/synthetic_moove.jsonl
    ds_type: json
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
    roles:
      system: [system]
      user: [user, human]
      assistant: [assistant, gpt]

val_set_size: 0.0

sequence_len: 8192
sample_packing: true

gradient_accumulation_steps: 1
micro_batch_size: 2
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 1e-5

bf16: auto
tf32: false

gradient_checkpointing: true
logging_steps: 1
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch: 0

saves_per_epoch: 0

wandb_project: $WANDB_PROJECT
wandb_entity: $WANDB_ENTITY

deepspeed: $PROJECT_ROOT/axolotl_config/deepspeed_zero_3.json

seed: 42
data_seed: 42
