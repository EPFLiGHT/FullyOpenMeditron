image = "${SCRATCH}/containers/new_axolotl.sqsh"
mounts = ["${SCRATCH}", "${HOME}"]   # the file systems the job reads and writes; adjust to your cluster

writable = true
workdir = "${HOME}/meditronFO"   # the path of this folder

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
CUDA_CACHE_DISABLE = "1"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_SAFE_DEVMEM_COPY_THRESHOLD = "16777216"
FI_CXI_COMPAT = "0"
SSL_CERT_FILE = "/root/miniconda3/envs/py3.10/lib/python3.10/site-packages/certifi/cacert.pem"


